<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kodi</title>
<style>
  html, body { margin: 0; height: 100%; background: #12181f; color: #e8eef4; font: 32px sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  #bar { width: 50%; height: 12px; background: #2a3440; border-radius: 6px; overflow: hidden; }
  #fill { width: 0; height: 100%; background: #17b2e7; transition: width .3s; }
  #err { color: #ff8a80; max-width: 70%; text-align: center; }
</style>
</head>
<body>
<div id="msg">Starting Kodi…</div>
<div id="bar"><div id="fill"></div></div>
<div id="err"></div>
<script>
  // The service (kodi-service.js) downloads Kodi into TizenBrew's data directory; Kodi runs
  // from there because only file:// pages get SharedArrayBuffer on the TV.
  function poll() {
    fetch('http://127.0.0.1:8083/status').then(function (r) { return r.json(); }).then(function (s) {
      if (s.state === 'ready') {
        // Chromium blocks this; the service opens Kodi through DevTools instead.
        location.replace(s.url);
        return waitForOpen();
      }
      if (s.state === 'error') { document.getElementById('err').textContent = s.error; return; }
      if (s.total) {
        document.getElementById('msg').textContent = 'Downloading Kodi (first start only): '
          + s.done + ' / ' + s.total + ' files, ' + Math.round(s.bytes / 1e6) + ' MB';
        document.getElementById('fill').style.width = (100 * s.done / s.total) + '%';
      }
      setTimeout(poll, 500);
    }).catch(function () { setTimeout(poll, 500); });
  }
  // Without DevTools (TizenBrew 2.1 starts without them) the service cannot open Kodi;
  // TizenBrew's own page can, so the way is back there.
  function waitForOpen() {
    fetch('http://127.0.0.1:8083/status?peek').then(function (r) { return r.json(); }).then(function (s) {
      if (!s.openError) return setTimeout(waitForOpen, 1000);
      document.getElementById('msg').textContent = 'Kodi is ready. Press Back, then open Kodi again.';
      document.getElementById('fill').style.width = '100%';
    }).catch(function () { setTimeout(waitForOpen, 1000); });
  }
  window.addEventListener('keydown', function (e) { if (e.keyCode === 10009) history.back(); });
  // Have the loader (service.js) check for newer service code; a changed copy takes over
  // by itself, and the status is followed meanwhile.
  fetch('http://127.0.0.1:8083/reload').catch(function () {});
  poll();
</script>
</body>
</html>
